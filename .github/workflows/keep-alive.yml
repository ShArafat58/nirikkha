# Keeps the free Neo4j Aura instance and the Render backend awake during judging.
# Neo4j Aura Free pauses after 72 hours without queries; this calls the graph API every 12 hours.
name: Keep demo services awake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours (UTC)
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the Render backend
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://nirikkha-api.onrender.com/health) || code=000
            echo "health try $i: $code"
            [ "$code" = "200" ] && break
            sleep 20
          done

      - name: Query the relationship graph (keeps Neo4j active)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://nirikkha-api.onrender.com/api/graph/719739) || code=000
            echo "graph try $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "Graph did not answer 200. Neo4j may be paused: resume it at console.neo4j.io"
          exit 1
