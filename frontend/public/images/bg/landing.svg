<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="room" cx="72%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1A2846"/>
      <stop offset="0.55" stop-color="#101A30"/>
      <stop offset="1" stop-color="#0B1220"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#24304A" stroke-width="1" opacity="0.45"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F1E8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#F5F1E8" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="glass" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#F5F1E8" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#F2B33D" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F2B33D" stop-opacity="0.02"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1220" stop-opacity="0.96"/>
      <stop offset="0.38" stop-color="#0B1220" stop-opacity="0.82"/>
      <stop offset="0.62" stop-color="#0B1220" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.7" stop-color="#0B1220" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#room)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="1380" cy="470" r="360" fill="#F2B33D" opacity="0.07" filter="url(#blur40)"/>
  <circle cx="1720" cy="820" r="220" fill="#4C9AFF" opacity="0.06" filter="url(#blur40)"/>

  <!-- back sheet -->
  <g transform="translate(1010 150) rotate(-7)">
    <rect width="560" height="740" rx="14" fill="url(#paper)" stroke="#F5F1E8" stroke-opacity="0.14"/>
    <g fill="#F5F1E8" opacity="0.16">
      <rect x="44" y="60" width="220" height="14" rx="4"/>
      <rect x="44" y="110" width="470" height="8" rx="4"/><rect x="44" y="140" width="430" height="8" rx="4"/>
      <rect x="44" y="170" width="455" height="8" rx="4"/><rect x="44" y="200" width="300" height="8" rx="4"/>
      <rect x="44" y="250" width="470" height="8" rx="4"/><rect x="44" y="280" width="410" height="8" rx="4"/>
      <rect x="44" y="310" width="460" height="8" rx="4"/><rect x="44" y="340" width="380" height="8" rx="4"/>
      <rect x="44" y="390" width="470" height="8" rx="4"/><rect x="44" y="420" width="440" height="8" rx="4"/>
      <rect x="44" y="450" width="250" height="8" rx="4"/>
    </g>
  </g>

  <!-- front sheet -->
  <g transform="translate(1150 230) rotate(5)">
    <rect x="10" y="14" width="560" height="740" rx="14" fill="#000" opacity="0.35" filter="url(#blur6)"/>
    <rect width="560" height="740" rx="14" fill="url(#paper)" stroke="#F5F1E8" stroke-opacity="0.22"/>
    <rect x="44" y="52" width="150" height="10" rx="5" fill="#F2B33D" opacity="0.8"/>
    <rect x="44" y="80" width="280" height="16" rx="4" fill="#F5F1E8" opacity="0.35"/>
    <rect x="40" y="134" width="420" height="26" rx="4" fill="#F2B33D" opacity="0.32"/>
    <g fill="#F5F1E8" opacity="0.28">
      <rect x="44" y="142" width="400" height="9" rx="4"/>
      <rect x="44" y="180" width="470" height="9" rx="4"/><rect x="44" y="210" width="420" height="9" rx="4"/>
      <rect x="44" y="240" width="455" height="9" rx="4"/><rect x="44" y="270" width="350" height="9" rx="4"/>
    </g>
    <rect x="40" y="316" width="360" height="26" rx="4" fill="#F2B33D" opacity="0.32"/>
    <g fill="#F5F1E8" opacity="0.28">
      <rect x="44" y="324" width="340" height="9" rx="4"/>
      <rect x="44" y="362" width="470" height="9" rx="4"/><rect x="44" y="392" width="440" height="9" rx="4"/>
      <rect x="44" y="422" width="300" height="9" rx="4"/>
      <rect x="44" y="472" width="470" height="9" rx="4"/><rect x="44" y="502" width="410" height="9" rx="4"/>
      <rect x="44" y="532" width="460" height="9" rx="4"/><rect x="44" y="562" width="260" height="9" rx="4"/>
    </g>
    <g fill="none" stroke="#F5F1E8" stroke-opacity="0.22">
      <rect x="44" y="610" width="470" height="90" rx="6"/>
      <path d="M44 640H514M44 670H514M200 610V700M360 610V700"/>
    </g>
    <rect x="360" y="640" width="154" height="30" fill="#F2B33D" opacity="0.28"/>
  </g>

  <!-- relationship graph -->
  <g stroke="#4C9AFF" stroke-width="2" stroke-opacity="0.45" fill="none">
    <path d="M1640 760 L1780 690 L1860 820 L1720 900 L1580 880 Z"/>
    <path d="M1640 760 L1720 900 M1780 690 L1820 560 M1580 880 L1490 960 M1860 820 L1900 950"/>
  </g>
  <g>
    <circle cx="1640" cy="760" r="16" fill="#F2B33D"/><circle cx="1640" cy="760" r="30" fill="#F2B33D" opacity="0.15"/>
    <circle cx="1780" cy="690" r="11" fill="#4C9AFF"/><circle cx="1860" cy="820" r="12" fill="#4C9AFF"/>
    <circle cx="1720" cy="900" r="10" fill="#4C9AFF"/><circle cx="1580" cy="880" r="9" fill="#4C9AFF"/>
    <circle cx="1820" cy="560" r="8" fill="#4C9AFF" opacity="0.8"/><circle cx="1490" cy="960" r="7" fill="#4C9AFF" opacity="0.7"/>
    <circle cx="1900" cy="950" r="7" fill="#4C9AFF" opacity="0.7"/>
  </g>

  <!-- lens with check -->
  <g transform="translate(1300 500)">
    <circle r="190" fill="#F2B33D" opacity="0.08" filter="url(#blur40)"/>
    <path d="M128 128 L250 250" stroke="#0B1220" stroke-width="40" stroke-linecap="round" opacity="0.6"/>
    <path d="M128 128 L250 250" stroke="#F2B33D" stroke-width="28" stroke-linecap="round"/>
    <path d="M150 150 L240 240" stroke="#FFD27A" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <circle r="168" fill="url(#glass)" stroke="#F2B33D" stroke-width="14"/>
    <circle r="150" fill="none" stroke="#FFD27A" stroke-width="2" opacity="0.5"/>
    <path d="M-70 4 L-20 54 L80 -58" fill="none" stroke="#F2B33D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-110 -70 A130 130 0 0 1 -40 -125" fill="none" stroke="#F5F1E8" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  </g>

  <rect width="1920" height="1080" fill="url(#shade)"/>
  <rect width="1920" height="1080" fill="url(#floor)"/>
</svg>